<text x="590" y="110" font-weight="bold">Repères</text>
<text x="590" y="128">① Ligne : fil Cu rigide 2,5 mm² (Ø1,78) dénudé,</text>
<text x="590" y="146">    à 5 mm (bord à bord) des éléments, 4 mm du boom.</text>
<text x="590" y="164">② Trou Ø4 traversant le boom à 42 mm (mi-distance),</text>
<text x="590" y="182">    axe parallèle aux éléments ; garder l’isolant</text>
<text x="590" y="200">    PVC du fil dans le trou.</text>
<text x="590" y="218">③ Embase BNC/SMA sur le boom au pied du radiateur ;</text>
<text x="590" y="236">    masse = boom.</text>
<text x="590" y="254">④ Point X : âme → C ≈ 6,7 pF → X</text>
<text x="590" y="272">    (ajustable 2–10 pF, puis fixe NP0 de même valeur).</text>
<text x="590" y="290" font-weight="bold">Mécanique</text>
<text x="590" y="308">Éléments tube Cu Ø4, continus, soudés au boom</text>
<text x="590" y="326">  en leur centre (point froid, tension nulle).</text>
<text x="590" y="344">Prises soudées : réflecteur 55 mm côté +,</text>
<text x="590" y="362">  radiateur 47 mm côté − (ligne croisée).</text>
<text x="590" y="380">Boom Cu Ø10 ; poignée isolante derrière le réflecteur.</text>
<text x="590" y="398" font-weight="bold">Simulation NEC-2, 446,1 MHz, espace libre</text>
<text x="590" y="416">Z = 51 Ω ; ROS ≤ 1,02 sur 446,0–446,2 MHz</text>
<text x="590" y="434">ROS ≤ 1,2 de 443 à 449 MHz</text>
<text x="590" y="452">AV/AR ≈ 19 dB ; ouverture −3 dB ≈ 80° (plan H)</text>
<text x="590" y="470">Gain ≈ 4 dBd (corrigé de l’AGT)</text>
<text x="590" y="488">Tolérances ±1 mm : ROS ≤ 1,07, AV/AR ≥ 18 dB</text>
<text x="590" y="506" font-weight="bold">Réglage</text>
<text x="590" y="524">Ajuster C au ROS mini. Si ROS mini > 1,3 :</text>
<text x="590" y="542">  déplacer la prise radiateur de ±3 mm.</text>
<text x="590" y="560">Variante éléments Ø3 : réfl. 334, rad. 301 mm.</text>
</svg>